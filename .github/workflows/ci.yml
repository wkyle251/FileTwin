name: Native preview checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-14
          - macos-15
          - macos-26
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: rustc -vV
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -p filetwin-core --example schemas -- schemas --check
      - run: cargo build --locked --release --workspace --bins --examples
      - run: target/release/filetwin --help
      - run: python3 scripts/smoke.py target/release/filetwin
