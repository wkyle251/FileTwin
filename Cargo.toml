[workspace]
members = ["crates/filetwin-core", "crates/filetwin-cli", "crates/filetwin-worker"]
resolver = "3"

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "PolyForm-Noncommercial-1.0.0"
license-file = "LICENSE"

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
