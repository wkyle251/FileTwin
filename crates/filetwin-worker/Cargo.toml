[package]
name = "filetwin-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
filetwin-core = { path = "../filetwin-core" }
image = { version = "=0.25.10", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881"] }
quick-xml = "=0.42.0"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rustfft = "6"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
tempfile.workspace = true

[lints]
workspace = true
